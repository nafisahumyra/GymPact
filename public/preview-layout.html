<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPact Layout Preview</title>
    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="preview-layout.css">
</head>
<body class="preview-page" data-protected-page data-protected-script="preview-layout.js">
    <header class="preview-header">
        <div class="preview-header-inner">
            <div><p class="preview-kicker">Layout preview</p><h1>GymPact</h1></div>
            <a class="preview-return" href="dashboard.html">Return to original</a>
        </div>
    </header>
    <main class="preview-main" id="preview-main">
        <section class="preview-screen is-active" data-preview-screen="home">
            <div class="preview-title"><div><p class="preview-kicker">Today</p><h2 id="preview-greeting">Home</h2></div><button class="preview-primary" type="button" data-open-workout>+ Log workout</button></div>
            <section class="preview-section"><div class="preview-section-heading"><h3>This week</h3><button class="preview-link" data-preview-tab="pacts" type="button">View Pact</button></div><div id="preview-week-summary"></div></section>
            <section class="preview-section"><div class="preview-section-heading"><h3>This month</h3><button class="preview-link" data-preview-tab="pacts" type="button">View Pact</button></div><div id="preview-month-summary"></div></section>
            <div id="preview-reminders"></div>
        </section>

        <section class="preview-screen" data-preview-screen="activity" hidden>
            <div class="preview-title"><div><p class="preview-kicker">Shared timeline</p><h2>Activity</h2></div><button class="preview-primary" type="button" data-open-workout>+ Log workout</button></div>
            <div id="preview-activity" class="preview-timeline"></div>
        </section>

        <section class="preview-screen" data-preview-screen="progress" hidden>
            <div class="preview-title"><div><p class="preview-kicker">Shared effort</p><h2>Progress</h2></div></div>
            <section class="preview-section"><h3>Weekly goals</h3><div id="preview-pact-progress"></div></section>
            <section class="preview-section"><h3>Exercise trackers</h3><div id="preview-trackers"></div></section>
            <section class="preview-section"><h3>Lifetime</h3><div id="preview-lifetime" class="preview-stats"></div></section>
        </section>

        <section class="preview-screen" data-preview-screen="pacts" hidden>
            <div class="preview-title"><div><p class="preview-kicker">Commitments</p><h2>Pacts</h2></div></div>
            <div class="preview-switch" role="tablist"><button type="button" class="is-active" data-pact-view="weekly">Weekly</button><button type="button" data-pact-view="monthly">Monthly</button></div>
            <div id="preview-weekly-pact"></div>
            <div id="preview-monthly-pact" hidden></div>
        </section>
    </main>
    <nav class="preview-nav" aria-label="Layout preview navigation">
        <button class="is-active" type="button" data-preview-tab="home"><span>⌂</span>Home Dev</button>
        <button type="button" data-preview-tab="activity"><span>◷</span>Activity Dev</button>
        <button type="button" data-preview-tab="progress"><span>↗</span>Progress Dev</button>
        <button type="button" data-preview-tab="pacts"><span>✓</span>Pact Dev</button>
    </nav>
    <dialog id="preview-photo-dialog" class="preview-photo-dialog"><button type="button">Close</button><img alt="Workout proof"></dialog>
    <dialog id="preview-action-dialog" class="preview-action-dialog"></dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="protected-page-guard.js"></script>
</body>
</html>
