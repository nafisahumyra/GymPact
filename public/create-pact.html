<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Pact | GymPact</title>

    <link rel="icon" href="assets/gp-images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/gp-images/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body data-protected-page data-protected-script="create-pact.js">

    <main class="dashboard-container">

        <h1 class="page-title">
            <img src="assets/gp-images/logo.png" alt="GymPact">
            <span>Create Challenge</span>
        </h1>

        <form id="create-pact-form" class="modal-content pact-form">

            <label for="pact-goal-type">Goal type</label>
            <select id="pact-goal-type" required>
                <option value="workouts">Workouts</option>
            </select>

            <label for="pact-target-amount">Target amount</label>
            <input
                type="number"
                id="pact-target-amount"
                min="1"
                step="1"
                placeholder="Example: 5"
                required
            >

            <label for="pact-timeframe">Timeframe</label>
            <select id="pact-timeframe" required>
                <option value="" disabled selected>Select a timeframe</option>
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
            </select>

            <label for="pact-wager-type">Wager type</label>
            <select id="pact-wager-type" required>
                <option value="" disabled selected>Select a wager type</option>
                <option value="reward">Reward</option>
                <option value="punishment">Punishment</option>
            </select>

            <label for="pact-wager-description">Wager description</label>
            <input
                type="text"
                id="pact-wager-description"
                placeholder="Example: Winner chooses movie night"
                required
            >

            <div class="modal-buttons">
                <button type="button" id="cancel-pact">Cancel</button>
                <button type="submit">Create Pact</button>
            </div>

        </form>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="protected-page-guard.js"></script>

</body>

</html>
