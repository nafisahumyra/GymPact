<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact Dashboard</title>

    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/gp-images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>


<body data-protected-page data-protected-script="dashboard.js">

    <div class="dashboard-container">

        <div class="dashboard-header">

            <h1 class="brand-lockup">
                <img src="assets/gp-images/logo.png" alt="GymPact">
                <img class="wordmark-image" src="assets/gp-images/gympact-wordmark.png" alt="">
            </h1>

            <button id="dashboard-refresh" class="refresh-button" type="button">
                ↻ Refresh
            </button>

        </div>

        <h2 id="welcome-message"></h2>

        <p id="dashboard-refresh-feedback" class="refresh-feedback" role="status" hidden></p>


        <section class="dashboard-section">

            <h3>🔥 Your Progress</h3>

            <div class="stats-container">

                <div class="stat-card">
                    <h4>Workouts</h4>
                    <p id="workout-count">0</p>
                </div>


                <div class="stat-card">
                    <h4>Current Streak</h4>
                    <p id="streak-count">0 days</p>
                </div>

            </div>

        </section>



        <section class="dashboard-section">

            <h3>🔥 Current Challenge</h3>

            <div id="current-challenge" class="pact-card"></div>

        </section>

       

        <div class="button-group">

            <button id="open-workout-modal">
                + Log Workout
            </button>
        
            <button id="history-button">
                📖 History
            </button>

            <button id="new-challenge-button">
                🤝 New Challenge
            </button>
        
        </div>



        <!-- Workout Modal -->

    <div id="workout-modal" class="modal">


        <div class="modal-content">


            <h2>Add Workout</h2>


            <h3>Muscle Groups <span class="required-marker">*</span></h3>


            <div class="muscle-options">

                <button class="muscle-chip" data-muscle="Abs"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/Ab.png" alt=""></span>Abs</button>

                <button class="muscle-chip" data-muscle="Back"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/back.png" alt=""></span>Back</button>

                <button class="muscle-chip" data-muscle="Biceps"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/Bicep.png" alt=""></span>Biceps</button>

                <button class="muscle-chip" data-muscle="Boxing"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/Boxing.png" alt=""></span>Boxing</button>

                <button class="muscle-chip" data-muscle="Cardio"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/Cardio.png" alt=""></span>Cardio</button>

                <button class="muscle-chip" data-muscle="Chest"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/chest.png" alt=""></span>Chest</button>

                <button class="muscle-chip" data-muscle="HIIT"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/HIIT.png" alt=""></span>HIIT</button>

                <button class="muscle-chip" data-muscle="Legs"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/Leg.png" alt=""></span>Legs</button>

                <button class="muscle-chip" data-muscle="Pullups"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/Pullup.png" alt=""></span>Pullups</button>

                <button class="muscle-chip" data-muscle="Pushups"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/pushup.png" alt=""></span>Pushups</button>

                <button class="muscle-chip" data-muscle="Shoulders"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/shoulder.png" alt=""></span>Shoulders</button>

                <button class="muscle-chip" data-muscle="Triceps"><span class="muscle-icon-container"><img class="muscle-icon" src="assets/gp-images/triecep.png" alt=""></span>Triceps</button>

            </div>


            <section class="measurements-section" aria-label="Workout measurements">

                <button id="add-measurement" class="add-measurement-button" type="button">
                    + Add
                </button>

                <div id="measurement-rows" class="measurement-rows"></div>

            </section>


            <label class="proof-upload" for="workout-photo">
                <span>Proof Photo <span class="required-marker">*</span></span>
                <strong>⌾&nbsp; Tap to upload photo</strong>
            </label>

            <input
                type="file"
                id="workout-photo"
                accept="image/*"
                class="proof-file-input"
            >

            <img
                id="workout-photo-preview"
                class="workout-photo-preview"
                alt=""
                hidden
            >


            <label>
                Notes (optional)
            </label>

            <textarea
                id="workout-notes"
                placeholder="How did it go?"
            ></textarea>


            <div class="modal-buttons">

                <button id="close-workout-modal">
                    Cancel
                </button>


                <button id="save-workout">
                    Save Workout
                </button>

            </div>


        </div>


    </div>


    </div>


    <div id="challenge-active-modal" class="modal">

        <div class="modal-content challenge-modal-content">

            <h2>Current Challenge Active</h2>

            <p>
                You can only have one challenge at a time.
            </p>

            <div class="modal-buttons">
                <button id="open-cancel-challenge-modal">
                    Cancel Challenge
                </button>

                <button id="close-challenge-active-modal">
                    Close
                </button>
            </div>

        </div>

    </div>


    <div id="cancel-challenge-modal" class="modal">

        <div class="modal-content challenge-modal-content">

            <h2>Cancel Challenge?</h2>

            <p>
                This challenge will be marked as cancelled and cannot be resumed.
            </p>

            <div class="modal-buttons">
                <button id="confirm-cancel-challenge">
                    Yes, Cancel Challenge
                </button>

                <button id="keep-challenge">
                    Keep Challenge
                </button>
            </div>

        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="protected-page-guard.js"></script>

</body>

</html>
