<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>


<body data-protected-content hidden>

    <div class="dashboard-container">

        <h1>🏋️ GymPact</h1>

        <h2 id="welcome-message"></h2>


        <section class="dashboard-section">

            <h3>🔥 Your Progress</h3>

            <div class="stats-container">

                <div class="stat-card">
                    <h4>Workouts</h4>
                    <p id="workout-count">0</p>
                </div>


                <div class="stat-card">
                    <h4>Current Streak</h4>
                    <p id="streak-count">0 days</p>
                </div>

            </div>

        </section>



        <section class="dashboard-section">

            <h3>🔥 Current Challenge</h3>

            <div id="current-challenge" class="pact-card"></div>

        </section>

       

        <div class="button-group">

            <button id="open-workout-modal">
                + Log Workout
            </button>
        
            <button id="history-button">
                📖 Workout History
            </button>

            <button id="new-challenge-button">
                🤝 New Challenge
            </button>
        
        </div>



        <!-- Workout Modal -->

    <div id="workout-modal" class="modal">


        <div class="modal-content">


            <h2>Log Workout</h2>


            <h3>Select Muscle Groups</h3>


            <div class="muscle-options">

                <button class="muscle-chip">Abs</button>

                <button class="muscle-chip">Back</button>

                <button class="muscle-chip">Biceps</button>

                <button class="muscle-chip">Cardio</button>

                <button class="muscle-chip">Chest</button>

                <button class="muscle-chip">Legs</button>

                <button class="muscle-chip">Shoulders</button>

                <button class="muscle-chip">Triceps</button>

            </div>


            <label>
                Duration (minutes)
            </label>

            <input 
                type="number"
                id="workout-duration"
                placeholder="Example: 80"
            >


            <label>
                Workout Proof 📸
            </label>

            <input
                type="file"
                id="workout-photo"
                accept="image/*"
            >

            <img
                id="workout-photo-preview"
                class="workout-photo-preview"
                alt="Selected workout proof preview"
                hidden
            >


            <label>
                Notes (optional)
            </label>

            <textarea
                id="workout-notes"
                placeholder="How did it go?"
            ></textarea>


            <div class="modal-buttons">

                <button id="close-workout-modal">
                    Cancel
                </button>


                <button id="save-workout">
                    Save Workout
                </button>

            </div>


        </div>


    </div>


    </div>


    <div id="challenge-active-modal" class="modal">

        <div class="modal-content challenge-modal-content">

            <h2>Current Challenge Active</h2>

            <p>
                You can only have one challenge at a time.
            </p>

            <div class="modal-buttons">
                <button id="open-cancel-challenge-modal">
                    Cancel Challenge
                </button>

                <button id="close-challenge-active-modal">
                    Close
                </button>
            </div>

        </div>

    </div>


    <div id="cancel-challenge-modal" class="modal">

        <div class="modal-content challenge-modal-content">

            <h2>Cancel Challenge?</h2>

            <p>
                This challenge will be marked as cancelled and cannot be resumed.
            </p>

            <div class="modal-buttons">
                <button id="confirm-cancel-challenge">
                    Yes, Cancel Challenge
                </button>

                <button id="keep-challenge">
                    Keep Challenge
                </button>
            </div>

        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="storage.js"></script>
<script src="access-guard.js"></script>
<script type="application/json" data-protected-page-script="dashboard.js"></script>

</body>

</html>
