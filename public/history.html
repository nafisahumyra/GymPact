<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact History</title>

    <link rel="icon" href="assets/gympact-mark.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/gympact-mark.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

</head>


<body data-protected-page data-protected-script="history.js">


<main class="dashboard-container history-page">

    <header class="history-header">

        <h1 class="page-title">
            <img src="assets/gympact-mark.svg" alt="" aria-hidden="true">
            <span>History</span>
        </h1>

        <div class="history-header-actions">

            <button id="history-refresh" class="refresh-button" type="button">
                ↻ Refresh
            </button>

            <button id="back-dashboard" class="secondary-button">
                Back to Dashboard
            </button>

        </div>

    </header>

    <p id="history-refresh-feedback" class="refresh-feedback" role="status" hidden></p>


    <div class="history-tabs" role="tablist" aria-label="History type">

        <button id="workouts-tab" class="history-tab is-active" role="tab" aria-selected="true">
            Workouts
        </button>

        <button id="challenges-tab" class="history-tab" role="tab" aria-selected="false">
            Challenges
        </button>

    </div>


    <p id="history-user" class="history-supporting-text"></p>


    <div id="workout-history">

        <p>No workouts logged yet.</p>

    </div>


    <div id="challenge-history" hidden></div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="protected-page-guard.js"></script>


</body>

</html>
