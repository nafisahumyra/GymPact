<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact</title>

    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/gp-images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css?v=track-tab-v1">

</head>


<body data-protected-page data-protected-script="history.js?v=track-tab-v1">


<main class="dashboard-container history-page">

    <header class="history-header">
        <button id="back-to-pact" class="history-back-button" type="button" aria-label="Back to Home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
            <span>Back</span>
        </button>
        <h1 id="history-page-title" class="history-page-title">Workout History</h1>
    </header>

    <p id="history-load-feedback" class="refresh-feedback" role="status" hidden></p>

    <div id="pact-history-tabs" class="history-tabs" hidden>
        <button id="weekly-pact-history-tab" class="history-tab" type="button">Weekly</button>
        <button id="monthly-pact-history-tab" class="history-tab" type="button">Monthly</button>
    </div>


    <div id="workout-history">

        <p>No workouts logged yet.</p>

    </div>


    <div id="challenge-history" hidden></div>

    <div id="history-quick-action-backdrop" class="quick-action-backdrop" hidden></div>

    <nav class="history-bottom-nav" aria-label="GymPact navigation">
        <div id="history-quick-action-menu" class="quick-action-menu" role="menu" aria-label="Quick actions" hidden>
            <button type="button" role="menuitem" class="quick-action-item" data-history-quick-action="exercise"><span>Log Exercise</span><span class="quick-action-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"></path></svg></span></button>
            <button type="button" role="menuitem" class="quick-action-item" data-history-quick-action="tracker"><span>Tracker</span><span class="quick-action-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19V5M4 19h16M8 15l3-3 3 2 5-6"></path></svg></span></button>
            <button type="button" role="menuitem" class="quick-action-item" data-history-quick-action="week-pact"><span>Week Pact</span><span class="quick-action-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M8 3v4M16 3v4M3.5 10h17M9 14h6l-3.6 5"></path></svg></span></button>
            <button type="button" role="menuitem" class="quick-action-item" data-history-quick-action="month-pact"><span>Month Pact</span><span class="quick-action-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M8 3v4M16 3v4M3.5 10h17M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01M16 17.5h.01"></path></svg></span></button>
            <button type="button" role="menuitem" class="quick-action-item quick-action-item-dev" data-history-quick-action="dev-view"><span>Dev View</span><span class="quick-action-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11.5 7.5 7h9l3.5 4.5"></path><path d="M3 12.5h18M6 12.5v4.25c0 1.24 1.01 2.25 2.25 2.25h7.5c1.24 0 2.25-1.01 2.25-2.25V12.5"></path><circle cx="9" cy="14.5" r="1"></circle><circle cx="15" cy="14.5" r="1"></circle></svg></span></button>
        </div>
        <div class="history-bottom-nav-controls">
        <div class="history-bottom-nav-inner">
            <a class="dashboard-tab history-dashboard-tab" href="dashboard.html">
                <span class="dashboard-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5 10v10h14V10M9 20v-6h6v6"></path></svg>
                </span>
                <span>Home</span>
            </a>
            <a class="dashboard-tab history-dashboard-tab" data-history-nav="activity" href="dashboard.html?tab=activity">
                <span class="dashboard-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l2-6 4 12 2-6h5"></path></svg>
                </span>
                <span>Activity</span>
            </a>
            <a class="dashboard-tab history-dashboard-tab" href="dashboard.html?tab=progress">
                <span class="dashboard-tab-icon" aria-hidden="true">↗</span>
                <span>Progress</span>
            </a>
            <a class="dashboard-tab history-dashboard-tab" data-history-nav="pact" href="dashboard.html?tab=pact">
                <span class="dashboard-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 14l2 2 4-4"></path></svg>
                </span>
                <span>Pact</span>
            </a>
            <a class="dashboard-tab history-dashboard-tab" href="dashboard.html?tab=track">
                <span class="dashboard-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-3 3 2 5-6"></path></svg>
                </span>
                <span>Track</span>
            </a>
        </div>
        <button id="history-quick-action-toggle" class="quick-action-toggle" type="button" aria-label="Open quick actions" aria-expanded="false" aria-controls="history-quick-action-menu"><span class="quick-action-toggle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"><path d="M12 1.55v20.9M1.55 12h20.9"></path></svg></span></button>
        </div>
    </nav>

    <dialog id="history-photo-dialog" class="history-photo-dialog">
        <button id="close-history-photo" class="history-photo-close" type="button" aria-label="Close photo">Close</button>
        <img id="history-photo-full" alt="">
    </dialog>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="protected-page-guard.js?v=profile-v1"></script>


</body>

</html>
