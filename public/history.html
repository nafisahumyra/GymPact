<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact</title>

    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/gp-images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

</head>


<body data-protected-page data-protected-script="history.js">


<main class="dashboard-container history-page">

    <header class="history-header">

        <h1 class="page-title">
            <img src="assets/gp-images/logo.png" alt="GymPact">
            <span id="history-page-title">Workout History</span>
        </h1>

        <div class="history-header-actions">

            <button id="back-to-pact" class="secondary-button" type="button">
                Back
            </button>

        </div>

    </header>

    <p id="history-load-feedback" class="refresh-feedback" role="status" hidden></p>

    <p id="history-user" class="history-supporting-text"></p>


    <div id="workout-history">

        <p>No workouts logged yet.</p>

    </div>


    <div id="challenge-history" hidden></div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="protected-page-guard.js"></script>


</body>

</html>
