<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Apple Health Steps Test</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: #0c0f0d;
            color: #f3f7f2;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }
        main {
            width: min(100% - 40px, 460px);
            padding: 28px;
            border: 1px solid #2c3530;
            border-radius: 24px;
            background: #151a17;
            text-align: center;
        }
        .icon { font-size: 2.5rem; }
        h1 { margin: 14px 0 8px; font-size: 1.5rem; }
        p { margin: 0; color: #a9b2ac; }
        output { display: block; margin-top: 28px; color: #9cfb74; font-size: clamp(2.75rem, 16vw, 4.75rem); font-weight: 800; letter-spacing: -.06em; }
        .label { margin-top: 7px; color: #a9b2ac; font-size: .95rem; }
        .error { color: #f1b1b1; font-size: 1rem; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true"></div>
        <h1>Apple Health Steps</h1>
        <p id="message">Waiting for the native app…</p>
        <output id="steps" hidden aria-live="polite"></output>
        <p id="label" class="label" hidden>steps today</p>
    </main>
    <script>
        const count = new URLSearchParams(window.location.hash.slice(1)).get("steps");
        const message = document.getElementById("message");
        const steps = document.getElementById("steps");
        const label = document.getElementById("label");

        if (/^\d+$/.test(count || "")) {
            message.textContent = "Received from GymPact Health Test";
            steps.textContent = Number(count).toLocaleString();
            steps.hidden = false;
            label.hidden = false;
        } else {
            message.textContent = "No step count received. Open this page from the GymPact Health Test app.";
            message.classList.add("error");
        }
    </script>
</body>
</html>
