<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact</title>

    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/gp-images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css?v=app-background-1">
    <link rel="stylesheet" href="index.css?v=lock-reveal-7">
</head>

<body>

    <main class="welcome-container">

        <section class="pin-lock" id="pin-lock" aria-labelledby="pin-lock-title">

            <div class="lock-icon" aria-hidden="true">
                <svg class="gympact-lock" viewBox="0 0 128 128" focusable="false">
                    <path class="gympact-lock-shackle" d="M48 71V49a16 16 0 0 1 32 0v22" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"></path>
                    <rect x="35" y="65" width="58" height="42" rx="12" fill="#1d3321" stroke="currentColor" stroke-width="3"></rect>
                    <path d="M64 86v8" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
                    <circle cx="64" cy="83" r="4" fill="currentColor"></circle>
                </svg>
            </div>

            <h1 class="logo" id="pin-lock-title">
                <img src="assets/gp-images/logo.png" alt="GymPact">
                <img class="wordmark-image" src="assets/gp-images/gympact-wordmark.png" alt="">
            </h1>

            <p class="subtitle">
                Enter the GymPact PIN to continue
            </p>

            <form class="pin-form" id="pin-form">
                <label class="sr-only" for="gympact-pin">GymPact PIN</label>
                <input
                    id="gympact-pin"
                    type="password"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    autofocus
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="••••••"
                    aria-describedby="pin-error"
                    required
                >

                <button type="submit" id="unlock-button">Unlock</button>
            </form>

            <p class="pin-error" id="pin-error" role="alert" aria-live="polite"></p>

        </section>

        <section class="athlete-selection-screen" id="athlete-selection" tabindex="-1" hidden>

        <h1 class="logo">
            <img src="assets/gp-images/logo.png" alt="GymPact">
            <img class="wordmark-image" src="assets/gp-images/gympact-wordmark.png" alt="">
        </h1>

        <p class="subtitle">
            Choose your athlete
        </p>

        <section class="user-selection">

            <div class="user-card" data-user="Nafisa">
                <img
                    src="assets/Nafisa.JPG"
                    alt="Nafisa"
                    class="profile-picture"
                >

                <h2>Nafisa</h2>

            </div>

            <div class="user-card" data-user="Mahfuzur">
                <img
                    src="assets/Mahfuzur.JPG"
                    alt="Mahfuzur"
                    class="profile-picture"
                >

                <h2>Mahfuzur</h2>

            </div>

        </section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js?v=lock-reveal-7"></script>

</body>
</html>
