<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact</title>

    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/gp-images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="welcome-container">

        <section class="pin-lock" id="pin-lock" aria-labelledby="pin-lock-title">

            <div class="lock-icon" aria-hidden="true">
                🔒
                <span class="lock-shackle"></span>
            </div>

            <p class="unlock-status" aria-live="polite">Unlocked</p>

            <h1 class="logo" id="pin-lock-title">
                <img src="assets/gp-images/logo.png" alt="GymPact">
                <span>Gym<span>Pact</span></span>
            </h1>

            <p class="subtitle">
                Enter the GymPact PIN to continue
            </p>

            <form class="pin-form" id="pin-form">
                <label class="sr-only" for="gympact-pin">GymPact PIN</label>
                <input
                    id="gympact-pin"
                    type="password"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    autofocus
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="••••••"
                    aria-describedby="pin-error"
                    required
                >

                <button type="submit" id="unlock-button">Unlock</button>
            </form>

            <p class="pin-error" id="pin-error" role="alert" aria-live="polite"></p>

        </section>

        <section class="athlete-selection-screen" id="athlete-selection" hidden>

        <h1 class="logo">
            <img src="assets/gp-images/logo.png" alt="GymPact">
            <span>Gym<span>Pact</span></span>
        </h1>

        <p class="subtitle">
            Choose your athlete
        </p>

        <section class="user-selection">

            <div class="user-card" data-user="Nafisa">
                <img
                    src="assets/Nafisa.JPG"
                    alt="Nafisa"
                    class="profile-picture"
                >

                <h2>Nafisa</h2>

            </div>

            <div class="user-card" data-user="Mahfuzur">
                <img
                    src="assets/Mahfuzur.JPG"
                    alt="Mahfuzur"
                    class="profile-picture"
                >

                <h2>Mahfuzur</h2>

            </div>

        </section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js"></script>

</body>
</html>
