<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact</title>

    <link rel="icon" href="assets/gp-images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/gp-images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css?v=app-background-2">
    <link rel="stylesheet" href="index.css?v=gentle-unlock-v4">
</head>

<body>

    <main class="welcome-container">

        <section class="pin-lock" id="pin-lock" aria-labelledby="pin-lock-title">

            <div class="lock-actor" aria-hidden="true">
                <div class="lock-face lock-face-front">
                    <svg viewBox="0 0 150 164" focusable="false">
                        <defs>
                            <linearGradient id="metal"><stop stop-color="#e1e6db"/><stop offset=".2" stop-color="#657560"/><stop offset=".45" stop-color="#e6ecd9"/><stop offset="1" stop-color="#667b56"/></linearGradient>
                            <linearGradient id="lock-body" x2=".8" y2="1"><stop stop-color="#38433a"/><stop offset="1" stop-color="#141b16"/></linearGradient>
                        </defs>
                        <path class="lock-shackle" d="M46 102V48a29 29 0 0 1 58 0v27" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round" style="transform-origin:46px 80px"/>
                        <rect x="28" y="75" width="94" height="78" rx="20" fill="url(#lock-body)" stroke="#93cb58" stroke-width="2"/>
                        <path d="M75 101a8 8 0 0 0-4 15l-3 15h14l-3-15a8 8 0 0 0-4-15" fill="url(#metal)" stroke="#080e08" stroke-width="2"/>
                        <path d="M36 91q0-9 10-9h57" fill="none" stroke="#c0ed90" opacity=".3"/>
                    </svg>
                </div>
            </div>

            <h1 class="logo" id="pin-lock-title">
                <img src="assets/gp-images/logo.png" alt="GymPact">
                <img class="wordmark-image" src="assets/gp-images/gympact-wordmark.png" alt="">
            </h1>

            <p class="subtitle">Show up. Together.</p>

            <form class="pin-form" id="pin-form">
                <label class="sr-only" for="gympact-pin">GymPact PIN</label>
                <input
                    id="gympact-pin"
                    type="password"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    autofocus
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="••••••"
                    aria-describedby="pin-error"
                    required
                >

                <button type="submit" id="unlock-button">Unlock</button>
            </form>

            <p class="pin-error" id="pin-error" role="alert" aria-live="polite"></p>

        </section>

        <section class="athlete-selection-screen" id="athlete-selection" tabindex="-1" hidden>

        <h1 class="logo">
            <img src="assets/gp-images/logo.png" alt="GymPact">
            <img class="wordmark-image" src="assets/gp-images/gympact-wordmark.png" alt="">
        </h1>

        <p class="subtitle">
            Choose your athlete
        </p>

        <section class="user-selection">

            <div class="user-card" data-user="Nafisa">
                <img
                    src="assets/Nafisa.JPG"
                    alt="Nafisa"
                    class="profile-picture"
                >

                <h2>Nafisa</h2>

            </div>

            <div class="user-card" data-user="Mahfuzur">
                <img
                    src="assets/Mahfuzur.JPG"
                    alt="Mahfuzur"
                    class="profile-picture"
                >

                <h2>Mahfuzur</h2>

            </div>

        </section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js?v=gentle-unlock-v2"></script>

</body>
</html>
