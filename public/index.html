<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymPact</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="welcome-container">

        <h1 class="logo">🏋️ GymPact</h1>

        <p class="subtitle">
            Choose your athlete
        </p>

        <section class="user-selection">

            <div class="user-card" data-user="Nafisa">
                <img
                    src="assets/Nafisa.JPG"
                    alt="Nafisa"
                    class="profile-picture"
                >

                <h2>Nafisa</h2>

            </div>

            <div class="user-card" data-user="Mahfuzur">
                <img
                    src="assets/Mahfuzur.JPG"
                    alt="Mahfuzur"
                    class="profile-picture"
                >

                <h2>Mahfuzur</h2>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
